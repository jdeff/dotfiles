id = "jdeff.flow"
name = "Flow"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Auto-apply the default layout (Claude + shell) to new worktrees."
platforms = ["macos", "linux"]

# Copy the worktree's untracked files (.env.local, .muster.yaml, …) from the main
# checkout, then lay it out. Chained in one handler because herdr runs separate
# `[[events]]` entries concurrently — as two entries, layout could launch the agent
# into a worktree whose .muster.yaml had not landed yet.
[[events]]
on = "worktree.created"
command = [
  "bash",
  "-c",
  "bash /Users/jdeff/.config/herdr/scripts/worktree-copy-files.sh; bash /Users/jdeff/.config/herdr/scripts/layout-agent-shell.sh",
]

# Also expose it as a manual action (menu + bindable) for existing workspaces.
[[actions]]
id = "layout"
title = "Layout: Claude + shell"
contexts = ["workspace"]
command = ["bash", "/Users/jdeff/.config/herdr/scripts/layout-agent-shell.sh"]

# Worktree lifecycle — open an interactive pane in the space and run the op.
[[actions]]
id = "merge"
title = "Merge worktree → base"
contexts = ["workspace"]
command = ["bash", "/Users/jdeff/.config/herdr/scripts/worktree-action.sh", "merge"]

[[actions]]
id = "open-pr"
title = "Open PR"
contexts = ["workspace"]
command = ["bash", "/Users/jdeff/.config/herdr/scripts/worktree-action.sh", "open-pr"]
