id = "jdeff.flow"
name = "Flow"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Auto-apply the workmux-style layout (Claude + shell) to new worktrees."
platforms = ["macos", "linux"]

# When `prefix+shift+g` creates a worktree, lay it out like workmux's panes default.
[[events]]
on = "worktree.created"
command = ["bash", "/Users/jdeff/.config/herdr/scripts/layout-agent-shell.sh"]

# Also expose it as a manual action (menu + bindable) for existing workspaces.
[[actions]]
id = "layout"
title = "Layout: Claude + shell"
contexts = ["workspace"]
command = ["bash", "/Users/jdeff/.config/herdr/scripts/layout-agent-shell.sh"]
