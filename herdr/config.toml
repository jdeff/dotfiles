onboarding = false
# herdr configuration — jdeff's multiplexer. Keys are laid out to match the muscle
# memory of the tmux + workmux setup this replaced (same ctrl+b prefix, same hjkl
# focus, same `-`/`|` splits), so most of it should feel familiar.
# Reload after edits: `herdr server reload-config`

# ── Appearance ────────────────────────────────────────────────────────────────
# Follows the macOS appearance natively (no dark-notify watcher needed here).
[theme]
# Mirrors your Ghostty: light:Kanagawa Lotus / dark:Kanagawa Wave, following macOS appearance.
name = "kanagawa"
auto_switch = true
dark_name = "kanagawa"          # Kanagawa Wave
light_name = "kanagawa-lotus"   # Kanagawa Lotus

# ── Shell / cwd ───────────────────────────────────────────────────────────────
[terminal]
default_shell = ""      # empty = $SHELL (your zsh), then /bin/sh
shell_mode = "auto"     # login shell on macOS
new_cwd = "follow"      # new panes/tabs inherit the focused pane's cwd

# ── Worktrees (native) ────────────────────────────────────────────────────────
# `prefix+shift+g` creates a worktree, opens it as a workspace grouped under the
# source repo. Branch already exists → checks out; new name → creates the branch.
[worktrees]
directory = "~/.herdr/worktrees"   # layout: <dir>/<repo>/<branch-slug>
                                   # switch to e.g. "~/code/.worktrees" for sibling dirs

# ── Keys ──────────────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

# Splits.
split_horizontal = "prefix+minus"    # stacked
split_vertical   = "prefix+|"        # side-by-side

# Pane focus — hjkl, as everywhere else.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next     = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Resize: Herdr uses a resize *mode*. `prefix+r` then h/j/k/l to resize,
# esc to exit.
resize_mode = "prefix+r"

zoom       = "prefix+z"
close_pane = "prefix+x"

# Tabs (a tab holds panes; spaces hold tabs).
new_tab      = "prefix+c"
next_tab     = "prefix+n"
previous_tab = "prefix+p"
switch_tab   = "prefix+1..9"
rename_tab   = "prefix+shift+t"
close_tab    = "prefix+shift+x"

# Workspaces ("spaces" = one per project or worktree) + worktree ops.
workspace_picker = "prefix+w"
goto             = "prefix+g"
new_workspace    = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace  = "prefix+shift+d"
new_worktree     = "prefix+shift+g"
open_worktree    = "prefix+shift+o"
# Remove the current worktree (checkout + space) — cleanup after a PR merge.
# Native action: opens a confirmation, prompts before forcing on a dirty tree, and
# never deletes the branch. prefix+x is close_pane, so this uses ctrl (pairs with
# prefix+ctrl+p = open PR). Also available via right-click on a worktree space.
remove_worktree = "prefix+ctrl+x"

# Switch between spaces prefix-free. Needs Ghostty macos-option-as-alt = true.
# alt+1..9 jumps to a space — see [keys.indexed] below.
next_workspace     = "alt+j"
previous_workspace = "alt+k"

# Agent sidebar cycling. Prefix-based (distinct from the alt+ space switching above).
# (To jump to a specific agent, use the goto picker prefix+g or click the sidebar.)
next_agent     = "prefix+shift+j"
previous_agent = "prefix+shift+k"

detach        = "prefix+q"
toggle_sidebar = "prefix+b"
reload_config = "prefix+shift+r"
edit_scrollback = "prefix+e"

# alt+1..9 jumps straight to space 1..9, prefix-free.
[keys.indexed]
workspaces = "alt"

# Seamless pane <-> vim/nvim split navigation (vim-tmux-navigator style).
# navigate.sh checks the focused pane's process: forwards ctrl+hjkl to vim if it's
# vim/nvim, otherwise moves Herdr pane focus. Editor side set up in your nvim config.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# lazygit in a throwaway pane — like your git popups. (l = lazygit)
[[keys.command]]
key = "prefix+shift+l"
type = "pane"
command = "lazygit"
description = "lazygit"

# Worktree lifecycle (interactive, in a pane; also on the jdeff.flow right-click menu).
# Run these from a pane inside the worktree you want to merge / PR.
[[keys.command]]
key = "prefix+shift+m"
type = "pane"
command = "bash /Users/jdeff/.config/herdr/scripts/worktree-merge.sh"
description = "merge worktree → base"

[[keys.command]]
key = "prefix+ctrl+p"
type = "pane"
command = "bash /Users/jdeff/.config/herdr/scripts/worktree-open-pr.sh"
description = "push + open PR"

# New worktree stacked on the CURRENT worktree's branch (workaround for herdr
# basing UI new-worktrees on main only). Run from inside the worktree to stack on.
[[keys.command]]
key = "prefix+shift+b"
type = "pane"
command = "bash /Users/jdeff/.config/herdr/scripts/worktree-new-from-here.sh"
description = "new worktree from current branch"

# Apply your default layout (claude focused + a shell beside it) to the current
# workspace. Runs detached; the script talks to Herdr over the socket. (a = apply)
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "/Users/jdeff/.config/herdr/scripts/layout-agent-shell.sh"
description = "layout: claude + shell"

# Devin Cloud sessions as workspaces: fzf over your cloud sessions, then open one
# streaming via `devin --cloud -r` (or focus the space already attached). (c = cloud)
[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "bash /Users/jdeff/.config/herdr/scripts/devin-cloud-pick.sh"
description = "devin cloud session picker"

# ── muster: run one feature's dev stack at a time ─────────────────────────────
# The herdr-native successor to the old tmux `prefix h` hotseat table. muster is
# a linked local plugin (~/src/muster), so these are plugin_action bindings — no
# absolute binary path needed, unlike the tmux popups that couldn't see ~/.local/bin.
# up/down/status/docker infer the project (and occupant) from the pane's cwd, so
# fire them from inside a project repo or worktree; menu/dashboard work anywhere.
[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "muster.dashboard"
description = "muster dashboard"

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "muster.menu"
description = "muster menu (fzf: restart/logs/per-service)"

[[keys.command]]
key = "prefix+alt+u"
type = "plugin_action"
command = "muster.up"
description = "muster up (this feature takes the ports)"

[[keys.command]]
key = "prefix+alt+x"
type = "plugin_action"
command = "muster.down"
description = "muster down (free the ports)"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "muster.status"
description = "muster status"

[[keys.command]]
key = "prefix+alt+k"
type = "plugin_action"
command = "muster.docker"
description = "muster lazydocker"

# ── UI / sidebar / notifications ──────────────────────────────────────────────
[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
sidebar_width = 26
accent = "#7e9cd8"                          # Kanagawa crystalBlue, for highlights/nav UI

[ui.toast]
delivery = "system"                        # OS notifications when a bg agent changes state
delay_seconds = 1

[ui.sound]
enabled = true                             # chimes when a background agent finishes / needs you

# ── Session persistence ───────────────────────────────────────────────────────
[session]
resume_agents_on_restore = true            # restart claude panes via `claude --resume` after server restart
